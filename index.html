<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- favicon.svg is the composited badge (gradient circle + logo) so
         the browser tab matches the in-app navbar badge. Falls back to
         /weblogo.png on iOS for the home-screen icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/weblogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
    <title>CollegeReady — Study Abroad Planning, Matching & Visa Practice</title>
    <meta name="description" content="Build a verified school shortlist, follow a personalised study-abroad roadmap, and rehearse your F-1 visa interview." />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph — what social platforms read when our URL is shared.
         og:image MUST be an absolute URL for every platform to fetch it
         (relative paths break LinkedIn + iMessage in particular). Keep
         the 1200×630 size; that's the default Open Graph spec and what
         X, Facebook, LinkedIn, Slack and Discord all expect. The PNG
         itself is generated by scripts/buildOgImage.cjs from the brand
         badge SVG — rerun that script if the design ever changes. -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="CollegeReady" />
    <meta property="og:title"       content="CollegeReady — From shortlist to takeoff." />
    <meta property="og:description" content="Verified school matching, a connected application roadmap, and live F-1 visa interview practice." />
    <meta property="og:url"         content="https://collegeready.io/" />
    <meta property="og:image"       content="https://collegeready.io/og-image.png" />
    <meta property="og:image:secure_url" content="https://collegeready.io/og-image.png" />
    <meta property="og:image:type"  content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"   content="CollegeReady — from shortlist to takeoff." />

    <!-- Twitter / X card. Falls back to og:* but having explicit
         twitter:* tags makes large-image cards reliable on X. -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="CollegeReady — From shortlist to takeoff." />
    <meta name="twitter:description" content="Verified school matching, application planning, and live F-1 visa interview practice." />
    <meta name="twitter:image"       content="https://collegeready.io/og-image.png" />
    <meta name="twitter:image:alt"   content="CollegeReady badge on a dark gradient backdrop." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
