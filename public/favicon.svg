<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Favicon = the same blue badge that sits in the navbar.
    A radial-gradient circle (sky-300 -> blue-400 -> blue-500) with the
    /weblogo.png composited on top. The PNG is white-on-transparent so the
    blue gradient shows through the transparent pixels. The image is sized
    larger than the canvas with negative offsets so the off-centre icon
    inside the PNG lands at the visual centre of the circle.
  -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>
  <image href="/weblogo.png" x="-25" y="-15" width="150" height="150" preserveAspectRatio="xMidYMid meet"/>
</svg>
